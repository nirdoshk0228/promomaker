services:
  - type: web
    name: promofinder
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PROMOFINDER_DB
        value: /tmp/promofinder.db
      - key: PROMOFINDER_ADMIN_TOKEN
        generateValue: true
      - key: PROMOFINDER_LLM_PROVIDER
        sync: false
      - key: PROMOFINDER_LLM_API_KEY
        sync: false
